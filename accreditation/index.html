<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>認定日本語教育機関 | インタラクティブ学習</title><style>:root{--bg:#f5f7fb;--ink:#17243b;--sub:#617086;--accent:#2457c5;--line:#dce4f0;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}header{background:linear-gradient(120deg,#142d58,#2457c5);color:white;padding:42px max(22px,calc((100vw - 1120px)/2))}header h1{font-size:clamp(25px,4vw,40px);line-height:1.35;margin:8px 0}header p{max-width:800px;color:#e4edff}.tag{font-size:12px;letter-spacing:.1em;font-weight:700}main{max-width:1120px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:240px 1fr;gap:24px}nav{align-self:start;position:sticky;top:18px;background:white;border:1px solid var(--line);border-radius:16px;padding:16px}nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:9px;color:var(--ink);cursor:pointer;font-size:14px}nav button.active{background:#e9f0ff;color:#1647a8;font-weight:700}nav button:hover{background:#f0f4fc}.content{min-width:0}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,38px);margin-bottom:18px;box-shadow:0 5px 20px #17243b08}.muted{color:var(--sub)}h2{font-size:25px;margin:0 0 10px}h3{font-size:18px;margin-top:27px}p{margin:10px 0 16px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em}.note{border-left:4px solid #2457c5;background:#f0f5ff;padding:14px 18px;border-radius:0 9px 9px 0;margin:22px 0}.warn{border-left-color:#d08b24;background:#fff8e9}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.mini{background:#f5f8ff;padding:18px;border-radius:12px}.mini strong{display:block;color:#1647a8}table{border-collapse:collapse;width:100%;font-size:14px;margin:20px 0}td,th{border-bottom:1px solid var(--line);padding:12px;text-align:left;vertical-align:top}th{background:#f2f6fc}.quiz{background:#f8faff;border:1px solid var(--line);border-radius:13px;padding:20px;margin:24px 0}.quiz legend{font-weight:700;margin-bottom:12px}.quiz label{display:block;padding:9px 12px;margin:7px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:white}.quiz label:has(input:checked){border-color:var(--accent);background:#eef4ff}.quiz button,.next,.reset{background:var(--accent);border:0;color:white;border-radius:9px;padding:11px 18px;cursor:pointer;font-weight:700}.result{margin-top:12px;font-weight:600}.sources a{display:block;margin:10px 0;color:#2055bd;overflow-wrap:anywhere}.progress{height:8px;background:#e2e9f5;border-radius:9px;overflow:hidden;margin:14px 0}.progress div{height:100%;background:#2e7dce;transition:width .2s}.hidden{display:none}.chapter-footer{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:24px}.small{font-size:13px}.term{font-weight:700;color:#204d9d}details{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0}summary{cursor:pointer;font-weight:700}@media(max-width:760px){main{display:block}nav{position:static;margin-bottom:18px;display:flex;overflow:auto;gap:4px}nav button{white-space:nowrap;width:auto}header{padding:28px 20px}.cards{grid-template-columns:1fr}.panel{padding:20px}table{font-size:12px}td,th{padding:8px}}</style></head><body><header><div class="tag">JAPANESE LANGUAGE EDUCATION · SELF STUDY</div><h1>認定日本語教育機関<br>制度と学校運営を学ぶ</h1><p>制度の全体像から教育課程設計、主任教員の実務、品質保証まで。公式資料を手がかりに、解説・ケーススタディ・理解度チェックで段階的に学ぶ。</p><div class="small">基準日：2026年11月16日｜学習目安：全6章・約2〜3時間</div></header><main><nav id="nav"></nav><div class="content"><div class="panel"><div class="eyebrow">YOUR LEARNING PROGRESS</div><div class="progress"><div id="bar" style="width:0%"></div></div><div id="status" class="small muted">0 / 6 章の確認問題に正解</div></div><div id="lesson"></div></div></main><script>
const sources={law:['法令・認定基準（文部科学省）','https://www.mext.go.jp/a_menu/nihongo_kyoiku/mext_02665.html'],criteria:['認定審査資料・教育課程編成指針（文部科学省）','https://gkz781swok1ivzu2.www.mext.go.jp/a_menu/nihongo_kyoiku/mext_02666.html'],manual:['認定申請等の手引き（文部科学省）','https://www.mext.go.jp/a_menu/nihongo_kyoiku/1246441_00009.html'],portal:['認定機関検索（公式ポータル）','https://www.nihongokyouiku.mext.go.jp/top/guide-japanese-language-institution'],egov:['認定日本語教育機関認定基準（e-Gov）','https://laws.e-gov.go.jp/law/505M60000080040'],faq:['制度に関するFAQ（文部科学省）','https://www.mext.go.jp/content/20251217-mxt_nihongo01-000034833_1.pdf']};
const chapters=[
{title:'制度の全体像',lead:'まず「学校の認定」と「教師個人の資格」を切り分ける。',html:`<h3>なぜ新制度ができたのか</h3><p>2024年4月に日本語教育機関認定法に基づく制度が始まった。日本語教育の質を確保し、学習者が目的に合う教育機関を選べるようにすることが柱である。文部科学大臣が、教員・施設・教育課程・支援体制などを審査して機関を認定する。</p><div class="cards"><div class="mini"><strong>機関の認定</strong>認定日本語教育機関：学校等の教育実施体制を審査</div><div class="mini"><strong>個人の登録</strong>登録日本語教員：教員個人の国家資格</div><div class="mini"><strong>課程の目的</strong>留学・就労・生活の3分野</div></div><h3>「認定」と「法務省告示」は同じではない</h3><p>従来の法務省告示校と、新制度の認定日本語教育機関は別の枠組み。移行期には経過措置があり、公式ポータルによれば2029年3月までは法務省告示校も一定の条件の下で留学生を受け入れて専ら日本語教育を行える。</p><div class="note">学校が認定されることと、そこに勤務する教員が登録日本語教員であることは、異なる法的な問いである。</div><h3>実務で考える</h3><p>募集広告で「国が認めた学校」と表現したい場合、認定の有無と認定マークの使用条件を確認する必要がある。</p>`,q:'登録日本語教員と認定日本語教育機関の関係で正しいのは？',opts:['両者は同じ資格・認定である','学校の認定と個人の登録は別制度である','認定を受けた学校では教員の要件が一切ない'],a:1,why:'機関に対する認定と、教員個人の登録を区別することが制度理解の出発点。',refs:['law','portal']},
{title:'法制度と認定基準',lead:'法令、基準、告示、指針、手引きの役割を理解する。',html:`<h3>資料の階層</h3><table><tr><th>資料</th><th>何を確認するか</th></tr><tr><td>法律・施行規則</td><td>認定制度の根拠、申請・報告等の仕組み</td></tr><tr><td>認定基準（省令）</td><td>校長・主任教員、教員数、施設、教育課程等の基準</td></tr><tr><td>告示・審査資料</td><td>具体的な取扱い、審査上の確認事項</td></tr><tr><td>教育課程編成指針</td><td>目的に応じた教育課程設計の考え方</td></tr><tr><td>申請の手引き</td><td>様式、記載方法、申請実務</td></tr></table><h3>認定は「書類がそろえば自動的に通る」ものではない</h3><p>組織・財務・施設・教職員・教育課程・学習者支援などの実態を、資料や審査を通じて確認する。認定後も変更届出や定期報告、自己点検・評価等が関係する。</p><div class="note warn">2026年4月施行の認定基準改正や2026年10月30日改定の審査要領がある。申請実務では、過去の説明会スライドだけで判断せず最新版を確認する。</div><h3>ケース</h3><p>学校が校舎を増設することになった。まず変更の種類を整理し、届出・認可等の要否と期限を最新の法令・手引きで確認する。校内の意思決定だけで完結させない。</p>`,q:'認定申請の具体的な記載方法を調べるのに最も直接的な資料は？',opts:['申請等の手引き','民間の学校ランキング','一般的な日本語教科書'],a:0,why:'手引きは申請様式や記載方法を説明する。ただし根拠となる法令・基準の確認も不可欠。',refs:['law','criteria','manual','egov']},
{title:'教育課程と学習評価',lead:'「何を教えたか」から「何ができるようになったか」へ。',html:`<h3>3分野は目的が異なる</h3><table><tr><th>分野</th><th>学習者が目指す場面</th><th>設計上の焦点</th></tr><tr><td>留学</td><td>進学・学術的な学び</td><td>学習・進学に必要な言語活動</td></tr><tr><td>就労</td><td>職場での業務遂行</td><td>報告・連絡・相談、指示理解等</td></tr><tr><td>生活</td><td>地域社会での日常生活</td><td>行政・医療・地域交流等</td></tr></table><h3>日本語教育の参照枠とCan do</h3><p>参照枠はA1〜C2の6レベルを使い、学習者が日本語で遂行できる活動を記述する。言語活動は「聞く」「読む」「話す（やり取り）」「話す（発表）」「書く」の5つを意識する。</p><div class="note"><strong>到達目標の書き換え例</strong><br>曖昧：「ビジネス日本語を理解する」<br>観察可能：「上司からの作業変更指示を聞き、変更点と期限を確認して言い直せる」</div><h3>評価設計の基本</h3><p>到達目標 → 学習活動 → 評価課題 → 評価基準を一貫させる。会話能力を評価するなら、文法の選択問題だけでなく、実際のやり取りを観察できる課題も検討する。</p><p>就労・生活課程の授業時数にはレベルごとの規定がある。例えばB1課程350時間以上、A2課程200時間以上、A1課程100時間以上という基準があり、留学課程の「単位時間」と混同しない。</p>`,q:'「職場で変更指示を確認できる」を評価する最も適切な方法は？',opts:['漢字の書き取りのみ','変更指示を聞き、確認質問をするロールプレイ','出席率のみ'],a:1,why:'到達目標がやり取りの遂行能力なら、評価課題でもその行動を観察する。',refs:['criteria','manual']},
{title:'教職員・主任教員',lead:'役職名ではなく、法令上の職務と配置要件を確認する。',html:`<h3>主な役割</h3><table><tr><th>役割</th><th>主な責務のイメージ</th></tr><tr><td>校長</td><td>機関全体の運営管理</td></tr><tr><td>主任教員</td><td>教育課程・教員への指導助言・教育の質の管理</td></tr><tr><td>教員</td><td>授業実施、学習評価、学習者への指導</td></tr><tr><td>事務・支援担当</td><td>在籍管理、学習者支援、事務運営</td></tr></table><h3>「教務主任」と「主任教員」</h3><p>学校内の呼称としての「教務主任」と、認定基準に規定された「主任教員」は必ずしも同義ではない。主任教員には資格・経験等の要件があるため、役職に就くだけで法令上の要件を満たすとは限らない。</p><h3>主任教員に求められる実務</h3><p>教育課程の整合性を確認し、授業観察・教員研修・成績評価の基準調整を進める。学生の学習成果を分析し、改善策を次の授業計画に反映させる。</p><div class="note">実務例：教師によって「会話B1」の合格判定がばらつく → 共通ルーブリックを作成 → 評価者間で模擬採点 → 不一致の理由を検討 → 再評価する。</div><p>主任教員の勤務経験の数え方や、就労・生活課程で必要な連携経験については公式FAQにも具体的な説明がある。</p>`,q:'主任教員の配置で最も適切な判断は？',opts:['校内で主任と呼ばれれば基準を満たす','担当する課程と法令上の資格・経験要件を確認する','日本語能力試験の合格歴だけで決める'],a:1,why:'校内役職名と法令上の配置要件は区別して確認する。',refs:['egov','faq']},
{title:'学校運営・品質保証',lead:'認定後の継続的な運営管理までが制度の射程。',html:`<h3>品質保証の循環</h3><div class="cards"><div class="mini"><strong>PLAN</strong>目標・教育課程・評価計画を設計</div><div class="mini"><strong>DO</strong>授業・学習支援・在籍管理を実施</div><div class="mini"><strong>CHECK → ACT</strong>学習成果と運営実態を検証し改善</div></div><h3>特に重要な管理領域</h3><p>出席状況と在留継続支援（特に留学課程）、学習・生活相談、適切な情報提供、教員研修、施設設備の維持、財務・運営体制の継続性、定期報告や情報公開など。</p><h3>学校の自己点検・評価</h3><p>授業アンケートの平均点だけでは教育の質は測れない。到達目標の達成率、評価の一貫性、進路・学習支援の実績、学生の困りごとへの対応など複数の証拠を使う。</p><div class="note">改善会議の問い：「学生満足度は高いのに、会話の到達目標を満たす学生が少ない。原因は教材・授業時間・評価方法のどこにあるか？」</div><h3>公開情報を読む演習</h3><p>公式ポータルで任意の認定校を検索し、課程分野・到達目標・修業期間・定員を比較する。実際の学校を比べると制度の要件が具体的に見える。</p>`,q:'教育の質を検証する証拠として最も適切なのは？',opts:['学生満足度だけ','授業時間数だけ','学習成果、評価の一貫性、支援実績など複数の指標'],a:2,why:'品質保証では、実施状況だけでなく成果と改善の根拠を組み合わせる。',refs:['criteria','portal']},
{title:'申請・実務ケース',lead:'制度知識を学校運営の意思決定に変える。',html:`<h3>申請準備の進め方</h3><ol><li>課程の目的（留学・就労・生活）と対象学習者を定義する。</li><li>最新の法令・認定基準・審査要領を確認し、要件一覧を作る。</li><li>教職員体制、施設、財務、学習者支援体制を点検する。</li><li>到達目標から教育課程・科目・評価方法を設計する。</li><li>様式と証拠資料の整合性を確認し、申請手順を進める。</li><li>認定後の報告・変更管理・自己点検の担当者を決める。</li></ol><h3>ケースA：AIによる会話評価を導入したい</h3><p>AI評価は便利だが、その点数が本当に会話能力を測っているか、学習者間で不公平な差が出ないか、教師の評価とどの程度一致するかを検証する。音声と文字起こしを分けて比較すると、発音・流暢さ・相互行為などの扱いを検討しやすい。</p><details><summary>検討のヒントを開く</summary><p>評価対象の構成概念を定義し、複数評価者による人手採点を用意する。AIとの一致率だけでなく、学習者の属性や課題別の誤差、説明可能性、個人情報の扱いも点検する。</p></details><h3>ケースB：就労課程を新設したい</h3><p>企業のニーズを聞くだけでなく、実際の職場タスクをCan doに変換し、授業課題と評価課題を設計する。主任教員の要件や外部関係者との連携も確認する。</p><div class="note warn">この教材は学習用の要約。実際の申請・法的判断は、最新の法令、審査要領、公式手引きおよび所管窓口の案内で確認する。</div>`,q:'新しい就労課程の設計で最初にすべきことは？',opts:['人気教科書を先に購入する','対象学習者と職場で必要な日本語行動を具体化する','最終試験の合格点だけを決める'],a:1,why:'目的・対象・到達目標を先に定めることで授業と評価の一貫性が生まれる。',refs:['manual','criteria','faq']}
];
let active=0;let passed=JSON.parse(localStorage.getItem('ninteiProgress')||'{}');function render(){document.getElementById('nav').innerHTML=chapters.map((c,i)=>`<button class="${i===active?'active':''}" onclick="go(${i})">${passed[i]?'✓ ':''}${i+1}. ${c.title}</button>`).join('')+'<button onclick="go(6)">◎ 総合復習・資料集</button>';const count=Object.keys(passed).filter(k=>passed[k]).length;document.getElementById('bar').style.width=(count/6*100)+'%';document.getElementById('status').textContent=`${count} / 6 章の確認問題に正解`;let root=document.getElementById('lesson');if(active===6){root.innerHTML=`<section class="panel"><div class="eyebrow">REVIEW & REFERENCES</div><h2>総合復習・公式資料</h2><p>理解度：${count}/6章。各章の問題に正解すると進捗が保存されます。</p><h3>説明できるかチェック</h3><ol><li>認定機関と登録日本語教員は何が違うか。</li><li>留学・就労・生活課程はどう異なるか。</li><li>Can do、授業活動、評価方法をどう整合させるか。</li><li>主任教員と校内の教務主任は必ず同じか。</li><li>認定後に必要な品質保証の活動は何か。</li><li>学校の申請資料を確認するとき、どの順番で公式資料を見るか。</li></ol><h3>一次資料へのリンク</h3><div class="sources">${Object.values(sources).map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]} ↗</a>`).join('')}</div><button class="reset" onclick="if(confirm('進捗をリセットしますか？')){passed={};localStorage.removeItem('ninteiProgress');render()}">学習進捗をリセット</button></section>`;return}let c=chapters[active];root.innerHTML=`<article class="panel"><div class="eyebrow">CHAPTER ${String(active+1).padStart(2,'0')} / 06</div><h2>${c.title}</h2><p class="muted">${c.lead}</p>${c.html}<div class="quiz"><div class="eyebrow">KNOWLEDGE CHECK</div><fieldset style="border:0;padding:0;margin:0"><legend>${c.q}</legend>${c.opts.map((o,i)=>`<label><input type="radio" name="answer" value="${i}"> ${o}</label>`).join('')}</fieldset><button onclick="check()">答え合わせ</button><div id="feedback" class="result" aria-live="polite"></div></div><h3>この章の根拠資料</h3><div class="sources">${c.refs.map(k=>`<a href="${sources[k][1]}" target="_blank" rel="noopener">${sources[k][0]} ↗</a>`).join('')}</div><div class="chapter-footer"><span class="small muted">${passed[active]?'✓ この章は正解済み':'問題に正解すると進捗に反映'}</span><button class="next" onclick="go(${active===5?6:active+1})">${active===5?'総合復習へ':'次の章へ →'}</button></div></article>`}function check(){const v=document.querySelector('input[name=answer]:checked');const f=document.getElementById('feedback');if(!v){f.textContent='選択肢を選んでください。';return}const c=chapters[active];if(Number(v.value)===c.a){passed[active]=true;localStorage.setItem('ninteiProgress',JSON.stringify(passed));f.textContent='✓ 正解！ '+c.why;document.getElementById('bar').style.width=(Object.keys(passed).filter(k=>passed[k]).length/6*100)+'%';document.getElementById('status').textContent=Object.keys(passed).filter(k=>passed[k]).length+' / 6 章の確認問題に正解';}else f.textContent='もう一度考えてみましょう。ヒント：'+c.why}function go(i){active=i;render();window.scrollTo({top:0,behavior:'smooth'})}render();</script></body></html>
