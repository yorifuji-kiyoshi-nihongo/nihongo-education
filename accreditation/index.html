<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>認定日本語教育機関 | インタラクティブ学習</title><style>:root{--bg:#f5f7fb;--ink:#17243b;--sub:#617086;--accent:#2457c5;--line:#dce4f0;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}header{background:linear-gradient(120deg,#142d58,#2457c5);color:white;padding:42px max(22px,calc((100vw - 1120px)/2))}header h1{font-size:clamp(25px,4vw,40px);line-height:1.35;margin:8px 0}header p{max-width:800px;color:#e4edff}.tag{font-size:12px;letter-spacing:.1em;font-weight:700}main{max-width:1120px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:240px 1fr;gap:24px}nav{align-self:start;position:sticky;top:18px;background:white;border:1px solid var(--line);border-radius:16px;padding:16px}nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:9px;color:var(--ink);cursor:pointer;font-size:14px}nav button.active{background:#e9f0ff;color:#1647a8;font-weight:700}nav button:hover{background:#f0f4fc}.content{min-width:0}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,38px);margin-bottom:18px;box-shadow:0 5px 20px #17243b08}.muted{color:var(--sub)}h2{font-size:25px;margin:0 0 10px}h3{font-size:18px;margin-top:27px}p{margin:10px 0 16px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em}.note{border-left:4px solid #2457c5;background:#f0f5ff;padding:14px 18px;border-radius:0 9px 9px 0;margin:22px 0}.warn{border-left-color:#d08b24;background:#fff8e9}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.mini{background:#f5f8ff;padding:18px;border-radius:12px}.mini strong{display:block;color:#1647a8}table{border-collapse:collapse;width:100%;font-size:14px;margin:20px 0}td,th{border-bottom:1px solid var(--line);padding:12px;text-align:left;vertical-align:top}th{background:#f2f6fc}.quiz{background:#f8faff;border:1px solid var(--line);border-radius:13px;padding:20px;margin:24px 0}.quiz legend{font-weight:700;margin-bottom:12px}.quiz label{display:block;padding:9px 12px;margin:7px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:white}.quiz label:has(input:checked){border-color:var(--accent);background:#eef4ff}.quiz button,.next,.reset{background:var(--accent);border:0;color:white;border-radius:9px;padding:11px 18px;cursor:pointer;font-weight:700}.result{margin-top:12px;font-weight:600}.sources a{display:block;margin:10px 0;color:#2055bd;overflow-wrap:anywhere}.progress{height:8px;background:#e2e9f5;border-radius:9px;overflow:hidden;margin:14px 0}.progress div{height:100%;background:#2e7dce;transition:width .2s}.hidden{display:none}.chapter-footer{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:24px}.small{font-size:13px}.term{font-weight:700;color:#204d9d}details{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0}summary{cursor:pointer;font-weight:700}@media(max-width:760px){main{display:block}nav{position:static;margin-bottom:18px;display:flex;overflow:auto;gap:4px}nav button{white-space:nowrap;width:auto}header{padding:28px 20px}.cards{grid-template-columns:1fr}.panel{padding:20px}table{font-size:12px}td,th{padding:8px}}progress{width:100%;accent-color:var(--accent)}.training-task{border-top:1px solid var(--line);padding:12px 0}.quiz label{overflow-wrap:anywhere}.quiz input{margin-right:6px}fieldset{min-width:0;border:0;padding:0;margin:0}.feedback{margin-top:12px}.feedback li{margin:8px 0}</style><link rel="stylesheet" href="../training.css"><link rel="stylesheet" href="../lesson.css"></head><body><header><div class="tag">JAPANESE LANGUAGE EDUCATION · SELF STUDY</div><h1>認定日本語教育機関<br>制度と学校運営を学ぶ</h1><p>制度の全体像から教育課程設計、主任教員の実務、品質保証まで。公式資料を手がかりに、解説・ケーススタディ・理解度チェックで段階的に学ぶ。</p><div class="small">公式資料確認日：2026年11月21日｜全6章・4択30問・言語化18問</div></header><main><nav id="nav"></nav><div class="content"><div class="panel"><h2>学習進捗</h2><progress id="bar" aria-label="4択問題の回答進捗" max="30" value="0"></progress><p id="status" class="small muted"></p></div><div id="lesson" tabindex="-1"></div></div></main>
<script src="../training.js"></script>
<script src="chapters.js"></script>
<script>
const sources = {
  "law": [
    "認定法・施行規則・認定告示（文部科学省）",
    "https://www.mext.go.jp/a_menu/nihongo_kyoiku/mext_02665.html"
  ],
  "criteria": [
    "認定等に関する資料一覧（文部科学省）",
    "https://www.mext.go.jp/a_menu/nihongo_kyoiku/mext_02666.html"
  ],
  "manual": [
    "認定申請等の手引き（2026年6月18日更新、記入要領・届出・報告）",
    "https://www.mext.go.jp/a_menu/nihongo_kyoiku/1246441_00009.html"
  ],
  "portal": [
    "認定機関検索・告示校の経過措置（公式ポータル）",
    "https://www.nihongokyouiku.mext.go.jp/top/guide-japanese-language-institution"
  ],
  "egov": [
    "認定日本語教育機関認定基準（e-Gov、第5条・第19条等）",
    "https://laws.e-gov.go.jp/law/505M60000080040"
  ],
  "faq": [
    "日本語教育機関認定法 よくある質問集（文部科学省）",
    "https://www.mext.go.jp/content/20260612-mxt_nihongo01-000034833_001.pdf.pdf"
  ],
  "review": [
    "認定等の審査要領（2026年10月30日改定）",
    "https://www.mext.go.jp/content/20250324-mxt_nihongo01-000034783_4.pdf"
  ],
  "checks": [
    "認定等に当たり確認すべき事項（教職員体制・点検等）",
    "https://www.mext.go.jp/content/20241015-mxt_nihongo01-000034783_1.pdf"
  ],
  "curriculum": [
    "日本語教育課程編成のための指針（2024年10月15日改定、第5節）",
    "https://www.mext.go.jp/content/20241015-mxt_nihongo01-000034783_2.pdf"
  ],
  "attendance": [
    "出席管理及び在留継続支援体制に係る運営ガイドライン",
    "https://www.mext.go.jp/content/20240412-mxt_nihongo01-000034783_3.pdf"
  ],
  "mark": [
    "認定マーク使用ガイドライン",
    "https://www.mext.go.jp/content/20240327-mxt_nihongo01-000034783_6.pdf"
  ]
};
const progressKey = 'ninteiQuizAnswers';
const legacyKey = 'ninteiProgress';
const reviewIndex = chapters.length;
let active = 0;
let answers = readProgress(progressKey);
let legacy = readProgress(legacyKey);

function readProgress(key) {
  try {
    return JSON.parse(localStorage.getItem(key)) || {};
  } catch {
    return {};
  }
}

function saveProgress() {
  try {
    localStorage.setItem(progressKey, JSON.stringify(answers));
  } catch {
    // The current page still works if the browser blocks storage.
  }
}

function links(keys) {
  return keys.map(key => {
    const [label, url] = sources[key];
    return `<a href="${url}" target="_blank" rel="noopener">${label} ↗</a>`;
  }).join('');
}

function chapterAnswers(index) {
  return chapters[index].qs.filter((_, question) => Number.isInteger(answers[`${index}_${question}`])).length;
}

function renderProgress() {
  const answered = chapters.reduce((sum, _, index) => sum + chapterAnswers(index), 0);
  const correct = chapters.reduce((sum, chapter, index) =>
    sum + chapter.qs.filter((question, number) => answers[`${index}_${number}`] === question.key).length, 0);
  const previous = chapters.filter((_, index) => legacy[index] === true).length;
  document.getElementById('bar').value = answered;
  document.getElementById('status').textContent =
    `回答 ${answered}/30 ・正答 ${correct}/30` + (previous ? ` ・旧版で正解済み ${previous}/6章` : '');
  document.getElementById('nav').innerHTML = chapters.map((chapter, index) =>
    `<button ${index === active ? 'class="active" aria-current="step"' : ''} onclick="go(${index})">
      ${index + 1}. ${chapter.title} (${chapterAnswers(index)}/5)${legacy[index] === true ? ' ｜旧版で正解済み' : ''}
    </button>`
  ).join('') + `<button ${active === reviewIndex ? 'class="active" aria-current="step"' : ''} onclick="go(${reviewIndex})">総合復習・資料集</button>`;
}

function renderQuiz(question, index) {
  const selected = answers[`${active}_${index}`];
  const done = Number.isInteger(selected);
  return `<form class="quiz" onsubmit="check(event, ${index})">
    <fieldset ${done ? 'disabled' : ''}>
      <legend>${index + 1}. ${question.q}</legend>
      ${question.opts.map((option, number) => `
        <label><input type="radio" name="answer" value="${number}" ${selected === number ? 'checked' : ''} required>
          ${'ABCD'[number]}. ${option}
        </label>`).join('')}
    </fieldset>
    ${done ? `
      <div class="feedback" id="feedback-${index}" tabindex="-1">
        <strong>${selected === question.key ? '正解' : '不正解'}。正答 ${'ABCD'[question.key]}</strong>
        <ul>${question.feedback.map((reason, number) => `
          <li><strong>${number === question.key ? 'OK' : 'NG'} ｜ ${'ABCD'[number]}. ${question.opts[number]}</strong><br>${reason}</li>
        `).join('')}</ul>
      </div>` : '<button type="submit">答え合わせ</button>'}
  </form>`;
}

function render() {
  renderProgress();
  const root = document.getElementById('lesson');
  if (active === reviewIndex) {
    root.innerHTML = `<section class="panel">
      <h2>総合復習・公式資料</h2>
      <p>各章の言語化トレーニングを使い、制度の根拠と実務での判断を説明できるか振り返ってください。</p>
      <h3>一次資料</h3>
      <div class="sources">${links(Object.keys(sources))}</div>
      <button class="reset" onclick="resetAll()">4択の学習進捗をリセット</button>
    </section>`;
    return;
  }
  const chapter = chapters[active];
  root.innerHTML = `<article class="panel">
    <h2>第${active + 1}章 ${chapter.title}</h2>
    <p class="note"><strong>学習目標</strong> ${chapter.lead}</p>
    <div class="lesson-explanation">${chapter.html}</div>
    <h3>この章の根拠資料</h3>
    <div class="sources">${links(chapter.refs)}</div>
    <h2>理解確認・応用問題</h2>
    ${chapter.qs.map(renderQuiz).join('')}
    ${renderTraining(chapter.training, 'accreditation', active)}
    <div class="chapter-footer">
      <button class="reset" onclick="retry()">この章を再挑戦</button>
      <button class="next" onclick="go(${active + 1})">${active + 1 === reviewIndex ? '総合復習へ' : '次の章へ →'}</button>
    </div>
  </article>`;
  restoreTrainingAnswers(root);
}

function check(event, index) {
  event.preventDefault();
  const form = event.currentTarget;
  const value = new FormData(form).get('answer');
  const key = `${active}_${index}`;
  if (value === null || Number.isInteger(answers[key])) return;
  answers[key] = Number(value);
  saveProgress();
  form.outerHTML = renderQuiz(chapters[active].qs[index], index);
  renderProgress();
  document.getElementById(`feedback-${index}`).focus();
}

function retry() {
  if (!confirm('この章の4択回答を消去しますか？')) return;
  chapters[active].qs.forEach((_, index) => delete answers[`${active}_${index}`]);
  saveProgress();
  go(active);
}

function resetAll() {
  if (!confirm('旧版の記録を含む学習進捗を消去しますか？')) return;
  answers = {};
  legacy = {};
  try {
    localStorage.removeItem(progressKey);
    localStorage.removeItem(legacyKey);
  } catch {
    // Clear the current page state even if storage is unavailable.
  }
  go(active);
}

function go(index) {
  active = index;
  render();
  document.getElementById('lesson').focus({preventScroll: true});
  window.scrollTo(0, 0);
}

render();

</script></body></html>
