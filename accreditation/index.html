rgin:0 auto;grid-template-columns:270px minmax(0,1fr);padding:24px;gap:24px}aside.course-sidebar{align-self:start;position:sticky;top:16px;background:white;border-radius:14px;padding:24px;box-shadow:0 2px 12px #1739530b}nav#nav{position:static;border:0;padding:0;border-radius:0;display:block}nav#nav button{display:block;width:100%;text-align:left;margin:5px 0;padding:9px 13px;border:1px solid #ccd8e2;border-radius:9px;background:white;color:#203047}nav#nav button:hover,nav#nav button.active{background:#dbeef4;border-color:#397c94;color:#203047}.panel{border:0;border-radius:14px;padding:24px;box-shadow:0 2px 12px #1739530b}.panel h3{color:#17647b}.note{background:#e9f5f5;border-left-color:#247d85}.quiz{background:white;border:0;border-top:1px solid #dbe3eb;border-radius:0;padding:15px 0;margin:0}.quiz button,.next,.reset,.sidebar-reset{font:inherit;cursor:pointer;border:1px solid #ccd8e2;background:white;color:#203047;border-radius:9px;padding:9px 13px}.quiz button:hover,.next:hover,.reset:hover,.sidebar-reset:hover{background:#dbeef4;border-color:#397c94}progress{accent-color:#247d85}.sidebar-reset{width:100%;margin-top:10px}.content{min-width:0}.chapter-footer{margin-top:24px}@media(max-width:760px){main{display:block;padding:12px}aside.course-sidebar{position:static;margin-bottom:12px;padding:15px}nav#nav{display:grid;grid-template-columns:1fr 1fr;gap:4px}nav#nav button{white-space:normal;width:100%;font-size:14px}header{padding:28px 20px}.panel{padding:18px}} .quiz .feedback{border-radius:10px;padding:12px 14px;background:#f1f5f8;color:#203047}.quiz .feedback>strong{display:block;margin-bottom:8px;color:#17647b}.quiz .feedback ul{list-style:none;padding:0;margin:0}.quiz .feedback li{padding:12px 14px;margin:8px 0;border:1px solid #ccd8e2;border-radius:9px;background:#fff;color:#203047}.quiz .feedback li.is-correct{background:#e0f3e6;border-color:#80b995}.quiz .feedback li .answer-verdict{display:block;font-weight:700}.quiz .feedback li.is-correct .answer-verdict{ </style></head><body><header><div class="tag">JAPANESE LANGUAGE EDUCATION · SELF STUDY</div><h1>認定日本語教育機関<br>制度と学校運営を学ぶ</h1><p>制度の全体像から教育課程設計、主任教員の実務、品質保証まで。公式資料を手がかりに、解説・ケーススタディ・理解度チェックで段階的に学ぶ。</p><div class="small">公式資料確認日：2026年11月21日｜全6章・4択30問・言語化18問</div></header><main><aside class="course-sidebar"><h3>学習進捗</h3><progress id="bar" aria-label="4択問題の回答進捗" max="30" value="0"></progress><p id="status" class="small muted"></p><nav id="nav" aria-label="章一覧"></nav><button class="sidebar-reset" onclick="clearAllCurrent()">全章の4択回答をクリア</button></aside><div class="content"><div id="lesson-audio" class="lesson-audio-host" hidden></div><div id="lesson" tabindex="-1"></div></div></main>
<script src="../training.js"></script>
<script src="chapters.js"></script>
<script src="../audio/player.js"></script>
<script>
const attachAudio = createLessonAudio(document.getElementById("lesson-audio"));
const sources = {
  "law": [
    "認定法・施行規則・認定告示（文部科学省）",
    "https://www.mext.go.jp/a_menu/nihongo_kyoiku/mext_02665.html"
  ],
  "criteria": [
    "認定等に関する資料一覧（文部科学省）",
    "https://www.mext.go.jp/a_menu/nihongo_kyoiku/mext_02666.html"
  ],
  "manual": [
    "認定申請等の手引き（2026年6月18日更新、記入要領・届出・報告）",
    "https://www.mext.go.jp/a_menu/nihongo_kyoiku/1246441_00009.html"
  ],
  "portal": [
    "認定機関検索・告示校の経過措置（公式ポータル）",
    "https://www.nihongokyouiku.mext.go.jp/top/guide-japanese-language-institution"
  ],
  "egov": [
    "認定日本語教育機関認定基準（e-Gov、第5条・第19条等）",
    "https://laws.e-gov.go.jp/law/505M60000080040"
  ],
  "faq": [
    "日本語教育機関認定法 よくある質問集（文部科学省）",
    "https://www.mext.go.jp/content/20260612-mxt_nihongo01-000034833_001.pdf.pdf"
  ],
  "review": [
    "認定等の審査要領（2026年10月30日改定）",
    "https://www.mext.go.jp/content/20250324-mxt_nihongo01-000034783_4.pdf"
  ],
  "checks": [
    "認定等に当たり確認すべき事項（教職員体制・点検等）",
    "https://www.mext.go.jp/content/20241015-mxt_nihongo01-000034783_1.pdf"
  ],
  "curriculum": [
    "日本語教育課程編成のための指針（2024年10月15日改定、第5節）",
    "https://www.mext.go.jp/content/20241015-mxt_nihongo01-000034783_2.pdf"
  ],
  "attendance": [
    "出席管理及び在留継続支援体制に係る運営ガイドライン",
    "https://www.mext.go.jp/content/20240412-mxt_nihongo01-000034783_3.pdf"
  ],
  "mark": [
    "認定マーク使用ガイドライン",
    "https://www.mext.go.jp/content/20240327-mxt_nihongo01-000034783_6.pdf"
  ]
};
const progressKey = 'ninteiQuizAnswers';
const legacyKey = 'ninteiProgress';
const reviewIndex = chapters.length;
let active = 0;
let answers = readProgress(progressKey);
let legacy = readProgress(legacyKey);

function readProgress(key) {
  try {
    return JSON.parse(localStorage.getItem(key)) || {};
  } catch {
    return {};
  }
}

function saveProgress() {
  try {
    localStorage.setItem(progressKey, JSON.stringify(answers));
  } catch {
    // The current page still works if the browser blocks storage.
  }
}

function links(keys) {
  return keys.map(key => {
    const [label, url] = sources[key];
    return `<a href="${url}" target="_blank" rel="noopener">${label} ↗</a>`;
  }).join('');
}

function chapterAnswers(index) {
  return chapters[index].qs.filter((_, question) => Number.isInteger(answers[`${index}_${question}`])).length;
}

function renderProgress() {
  const answered = chapters.reduce((sum, _, index) => sum + chapterAnswers(index), 0);
  const correct = chapters.reduce((sum, chapter, index) =>
    sum + chapter.qs.filter((question, number) => answers[`${index}_${number}`] === question.key).length, 0);
  const previous = chapters.filter((_, index) => legacy[index] === true).length;
  document.getElementById('bar').value = answered;
  document.getElementById('status').textContent =
    `回答 ${answered}/30 ・正答 ${correct}/30` + (previous ? ` ・旧版で正解済み ${previous}/6章` : '');
  document.getElementById('nav').innerHTML = chapters.map((chapter, index) =>
    `<button ${index === active ? 'class="active" aria-current="step"' : ''} onclick="go(${index})">
      ${index + 1}. ${chapter.title} (${chapterAnswers(index)}/5)${legacy[index] === true ? ' ｜旧版で正解済み' : ''}
    </button>`
  ).join('') + `<button ${active === reviewIndex ? 'class="active" aria-current="step"' : ''} onclick="go(${reviewIndex})">総合復習・資料集</button>`;
}

function renderQuiz(question, index) {
  const selected = answers[`${active}_${index}`];
  const done = Number.isInteger(selected);
  return `<form class="quiz" onsubmit="check(event, ${index})">
    <fieldset ${done ? 'disabled' : ''}>
      <legend>${index + 1}. ${question.q}</legend>
      ${question.opts.map((option, number) => `
        <label><input type="radio" name="answer" value="${number}" ${selected === number ? 'checked' : ''} required>
          ${'ABCD'[number]}. ${option}
        </label>`).join('')}
    </fieldset>
    ${done ? `
      <div class="feedback" id="feedback-${index}" tabindex="-1">
        <strong>${selected === question.key ? '正解' : '不正解'}。正答 ${'ABCD'[question.key]}</strong>
        <ul>${question.feedback.map((reason, number) => `
          <li class="${number === question.key ? 'is-correct' : 'is-incorrect'}"><strong class="answer-verdict">${number === question.key ? '✓ OK' : '✕ NG'} ｜ ${'ABCD'[number]}. ${question.opts[number]}</strong><span class="answer-reason">${reason}</span></li>
        `).join('')}</ul>
      </div>` : '<button type="submit">答え合わせ</button>'}
  </form>`;
}

function render() {
  renderProgress();
  const root = document.getElementById('lesson');
  if (active === reviewIndex) {
    attachAudio(root, null);
    root.innerHTML = `<section class="panel">
      <h2>総合復習・公式資料</h2>
      <p>各章の言語化トレーニングを使い、制度の根拠と実務での判断を説明できるか振り返ってください。</p>
      <h3>一次資料</h3>
      <div class="sources">${links(Object.keys(sources))}</div>
      <button class="reset" onclick="resetAll()">4択の学習進捗をリセット（旧版記録を含む）</button>
    </section>`;
    return;
  }
  const chapter = chapters[active];
  root.innerHTML = `<article class="panel">
    <h2>第${active + 1}章 ${chapter.title}</h2>
    <p class="note"><strong>学習目標</strong> ${chapter.lead}</p>
    <div class="lesson-explanation">${chapter.html}</div>
    <h3>この章の根拠資料</h3>
    <div class="sources">${links(chapter.refs)}</div>
    <h2>理解確認・応用問題</h2>
    ${chapter.qs.map(renderQuiz).join('')}
    ${renderTraining(chapter.training, 'accreditation', active)}
    <div class="chapter-footer">
      <button class="reset" onclick="retry()">この章の4択回答をクリア</button>
      <button class="next" onclick="go(${active + 1})">${active + 1 === reviewIndex ? '総合復習へ' : '次の章へ →'}</button>
    </div>
  </article>`;
  restoreTrainingAnswers(root);
  attachAudio(root.querySelector('article'), lessonAudioChapter("accreditation", active,
    [chapter.title, chapter.lead, chapter.html], "認定日本語教育機関"));
}

function check(event, index) {
  event.preventDefault();
  const form = event.currentTarget;
  const value = new FormData(form).get('answer');
  const key = `${active}_${index}`;
  if (value === null || Number.isInteger(answers[key])) return;
  answers[key] = Number(value);
  saveProgress();
  form.outerHTML = renderQuiz(chapters[active].qs[index], index);
  renderProgress();
  document.getElementById(`feedback-${index}`).focus();
}

function retry() {
  if (!confirm('この章の4択回答を消去しますか？')) return;
  chapters[active].qs.forEach((_, index) => delete answers[`${active}_${index}`]);
  saveProgress();
  go(active);
}

function clearAllCurrent() {
  if (!confirm('認定教材の全章の4択回答をクリアしますか？旧版記録・記述回答・音声設定は残ります。')) return;
  answers = {};
  saveProgress();
  render();
}

function resetAll() {
  if (!confirm('現行4択の回答と旧版の学習記録を両方削除しますか？記述回答と音声設定は残ります。')) return;
  answers = {};
  legacy = {};
  try {
    localStorage.removeItem(progressKey);
    localStorage.removeItem(legacyKey);
  } catch {
    // Clear the current page state even if storage is unavailable.
  }
  go(active);
}

function go(index) {
  active = index;
  render();
  document.getElementById('lesson').focus({preventScroll: true});
  window.scrollTo(0, 0);
}

render();

</script></body></html>
