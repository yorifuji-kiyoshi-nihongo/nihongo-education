<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本語教育の参照枠 ver2.0</title><style> *{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#203047;font:16px/1.85 system-ui,sans-serif}header{background:#173953;color:white;padding:32px max(5vw,20px)}header h1{margin:0;font-size:clamp(25px,4vw,40px)}header p{margin:0;color:#cce0ed}main{max-width:1250px;margin:auto;display:grid;grid-template-columns:270px 1fr;gap:24px;padding:24px}aside{align-self:start;position:sticky;top:16px}nav button{display:block;width:100%;text-align:left;margin:5px 0}button{font:inherit;cursor:pointer;border:1px solid #ccd8e2;background:white;color:#203047;border-radius:9px;padding:9px 13px}button:hover,button.active{background:#dbeef4;border-color:#397c94}article,aside{background:white;border-radius:14px;padding:24px;box-shadow:0 2px 12px #1739530b}h2{font-size:27px;line-height:1.4}h3{color:#17647b;margin-bottom:4px}p{margin-top:4px}.goal{background:#e9f5f5;padding:14px;border-left:4px solid #247d85}.question{border-top:1px solid #dbe3eb;padding:15px 0}.choices button{display:block;width:100%;text-align:left;margin:6px 0}.correct{background:#e0f3e6!important}.wrong{background:#ffe9e5!important}.feedback{color:#34576a;font-weight:600}progress{width:100%;accent-color:#247d85}a{color:#146581}textarea{width:100%;padding:12px;font:inherit;border:1px solid #ccd8e2;border-radius:8px}.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}.tag{font-size:13px;letter-spacing:.08em;color:#17647b}details{background:#f1f5f8;padding:12px;border-radius:8px;margin:12px 0} @media(max-width:760px){main{display:block;padding:12px}aside{position:static;margin-bottom:12px;padding:15px}nav{display:grid;grid-template-columns:1fr 1fr;gap:4px}article{padding:18px}}.reason{background:#f1f5f8;padding:12px;border-radius:10px;font-weight:normal}.reasonitem{border-top:1px solid #ccd8e2;padding:10px 0}.original-question{background:white;border-left:3px solid #397c94;padding:10px 12px;margin:4px 0 12px;line-height:1.65}.original-question span{font-size:12px;color:#17647b;font-weight:600}main{display:block;max-width:950px}button:disabled{cursor:default;color:#203047}h3{margin-top:28px}main{display:grid;max-width:1250px} @media(max-width:760px){main{display:block}} .reasonitem p{font-weight:400} nav button{font-size:14px}article{min-width:0;overflow-wrap:anywhere}summary{cursor:pointer}.training-task{border-top:1px solid #dbe3eb;padding:12px 0}.training-task details{margin:8px 0}</style><link rel="stylesheet" href="../training.css"><link rel="stylesheet" href="../lesson.css"><link rel="stylesheet" href="../audio/player.css">
<header><h1>日本語教育の参照枠</h1><p>ver2.0｜全10章・4択55問・言語化30問</p></header>
<main><aside><h3>学習進捗</h3><progress id="progress" aria-label="4択問題の回答進捗" max="55"></progress><p id="total"></p><nav id="nav"></nav><button onclick="if(confirm('全回答を消去しますか？')){state={};save();render()}">4択の回答をリセット</button><details><summary>公式資料</summary><a href="https://www.nihongo-ews.mext.go.jp/information/framework_of_reference">文部科学省：参照枠・活用の手引</a></details></aside><div style="min-width:0"><div id="lesson-audio" class="lesson-audio-host" hidden></div><article id="body" tabindex="-1"></article></div></main>
<script src="../training.js"></script>
<script src="chapters.js"></script>
<script src="../audio/player.js"></script>
<script>
let state={};try{state=JSON.parse(localStorage.getItem('ref-full9')||'{}')}catch(e){}
let current=0;
const attachAudio = createLessonAudio(document.getElementById("lesson-audio"));

function save(){try{localStorage.setItem('ref-full9',JSON.stringify(state))}catch(e){}}
function go(i){current=i;render();document.getElementById('body').focus({preventScroll:true});scrollTo(0,0)}
function choose(i,j){let k=current+'_'+i;if(state[k]!==undefined)return;state[k]=j;save();let y=scrollY;render();document.getElementById('feedback-'+i).focus({preventScroll:true});scrollTo(0,y)}
function render(){let ch=chapters[current],count=0,correct=0;document.getElementById('nav').innerHTML=chapters.map((c,k)=>{let n=c.qs.filter((q,i)=>state[k+'_'+i]!==undefined).length;count+=n;correct+=c.qs.filter((q,i)=>state[k+'_'+i]===q.key).length;return `<button class="${k===current?'active':''}" ${k===current?'aria-current="step"':''} onclick="go(${k})">${k+1}. ${c.title} (${n}/${c.qs.length})</button>`}).join('');document.getElementById('progress').value=count;document.getElementById('total').textContent=`回答 ${count}/55 ・正答 ${correct}/55`;let h=`<h2>第${current+1}章 ${ch.title}</h2><div class="goal">${ch.goal}</div><div class="lesson-explanation">${ch.content}</div><h2>理解確認・応用問題</h2>`;ch.qs.forEach((q,i)=>{let v=state[current+'_'+i];h+=`<div class="question"><b>${i+1}. ${current===9?'':i<2?'【理解確認】':'【応用】'}${q.q}</b><div class="choices">${q.opts.map((o,j)=>`<button ${v!==undefined?'disabled':''} class="${v!==undefined?(j===q.key?'correct':v===j?'wrong':''):''}" onclick="choose(${i},${j})">${'ABCD'[j]}. ${o}</button>`).join('')}</div>`;if(v!==undefined)h+=`<p class="feedback" id="feedback-${i}" tabindex="-1">${v===q.key?'正解':'不正解'}：正答 ${'ABCD'[q.key]}</p><div class="reason"><b>各選択肢の解説</b>${q.feedback.map((f,j)=>`<div class="reasonitem"><b style="color:${j===q.key?'#17653a':'#a13b31'}">${j===q.key?'OK':'NG'} ｜ ${'ABCD'[j]}. ${q.opts[j]}</b><p>${f}</p></div>`).join('')}</div>`;h+='</div>'});h+=`${renderTraining(ch.training, 'reference', current)}<div class="foot"><button onclick="if(confirm('この章の4択回答を消去しますか？')){chapters[current].qs.forEach((q,i)=>delete state[current+'_'+i]);save();render()}">この章を再挑戦</button>${current<9?`<button onclick="go(${current+1})">次の章へ →</button>`:'<button onclick="go(0)">第1章へ</button>'}</div>`;const root = document.getElementById('body');root.innerHTML=h;restoreTrainingAnswers(root);attachAudio(root, current === 0 ? {
  id: "reference:01", manifestUrl: "../audio/reference/01/manifest.json",
  source: [ch.title, ch.goal, ch.content],
  metadata: { title: "第1章 " + ch.title, album: "日本語教育の参照枠" }
} : null)}
render();
</script></html>
